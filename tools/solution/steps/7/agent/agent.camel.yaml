- route:
    id: rocketchat-to-agent
    description: RocketChat to Agent
    from:
      description: RocketChat
      uri: platform-http
      parameters:
        path: /ai-support
      steps:
        - setBody:
            description: get text
            jq:
              expression: .text
              resultType: String
        - setHeaders:
            description: set system prompt
            disabled: true
            headers:
              - language:
                  expression: resource:system.message
                  language: simple
                name: CamelLangChain4jAgentSystemMessage
              - name: CamelLangChain4jAgentMemoryId
                simple:
                  expression: "1"
        - step:
            description: "To do: Agent"
            steps:
              - setBody:
                  description: Dummy response
                  simple:
                    expression: |-
                      {
                         "text": "Hello World"
                      }
        - to:
            description: to rocketchat
            uri: direct
            parameters:
              name: to-rocketchat
- route:
    id: to-rocketchat
    description: to-rocketchat
    from:
      uri: direct
      parameters:
        name: to-rocketchat
      steps:
        - unmarshal:
            disabled: false
            json: {}
        - marshal:
            disabled: false
            json: {}
