## MCP server (Node JS)
# camel.component.langchain4j-agent.mcpServer[nodejs.transportType]=http
# camel.component.langchain4j-agent.mcpServer[nodejs.url]=http://localhost:9090/mcp

## MCP server (Camel Quarkus)
# camel.component.langchain4j-agent.mcpServer[quarkus.transportType]=http
# camel.component.langchain4j-agent.mcpServer[quarkus.url]=http://localhost:9091/mcp

# Model configuration
forage.myagent.agent.model.kind=openai
forage.myagent.agent.model.name=qwen3-14b
forage.myagent.agent.base.url=
forage.myagent.agent.api.key=

# Memory settings
forage.myagent.agent.features=memory
forage.myagent.agent.memory.kind=message-window
forage.myagent.agent.memory.max.messages=10

# Log configuration
forage.myagent.agent.log.requests=true
forage.myagent.agent.log.responses=true
