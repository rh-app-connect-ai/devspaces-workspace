- route:
    from:
      uri: direct
      parameters:
        name: tool-amend-invoice
      steps:
        - step:
            description: normal flow
            steps:
              - setVariable:
                  description: set file name
                  expression:
                    simple:
                      expression: invoice_${header.id}.pdf
                  name: filename
              - to:
                  id: to-1810-2640
                  uri: direct
                  parameters:
                    name: get-invoice-data
              - setBody:
                  id: setBody-4119
                  simple:
                    expression: |-
                      ${header.prompt}

                      ${body}
              - setHeader:
                  description: set system prompt
                  disabled: false
                  language:
                    expression: resource:prompt.amend
                    language: simple
                  name: CamelOpenAISystemMessage
              - to:
                  uri: openai
                  parameters:
                    operation: chat-completion
              - setBody:
                  simple:
                    expression: ${body.trim()}
                  disabled: true
              - setVariable:
                  id: setVariable-3622
                  name: summary
                  xpath:
                    expression: /Amendment/Summary/text()
                    saxon: true
                  description: get summary
              - setBody:
                  id: setBody-1842-3654
                  xpath:
                    expression: /Amendment/Content/Invoice
                    saxon: true
              - convertBodyTo:
                  id: convertBodyTo-1103
                  type: String
              - log:
                  id: log-1389
                  message: "summary: ${variable.summary}\\n${body}"
              - to:
                  uri: sql
                  parameters:
                    query: >-
                      INSERT INTO invoices (id, data) VALUES
                      (:#${header.id},:#${body})

                      ON CONFLICT (id)

                      DO UPDATE SET data = EXCLUDED.data
              - to:
                  id: to-1542
                  uri: direct
                  parameters:
                    name: store-pdf-s3
                  disabled: false
              - setBody:
                  id: setBody-3423
                  simple:
                    expression: >-
                      {
                        "status":"done",
                        "summary":  "${variable.summary}",
                        "actions":"1) Inform the user with 'The database records have been updated'. 2) Provide summary. 3) Ask if they'd like to see the new PDF invoice."
                      }
            disabled: false
- route:
    id: get-invoice-data
    description: get-invoice-data
    from:
      id: from-1847
      uri: direct
      parameters:
        name: get-invoice-data
      steps:
        - convertHeaderTo:
            id: convertHeaderTo-9760
            name: id
            type: String
        - to:
            id: to-1530
            uri: sql
            parameters:
              query: select data from invoices where id = :#${header.id}
        - setBody:
            id: setBody-1160
            simple:
              expression: ${body[0]}
            disabled: true
        # - unmarshal:
        #     jacksonXml: {}
        #     disabled: true
        # - marshal:
        #     id: marshal-4078
        #     jacksonXml: {}
        #     disabled: true
        - log:
            id: log-1096
            message: ${body}



- route:
    from:
      uri: direct
      parameters:
        name: tool-get-data
      steps:
        - to:
            uri: direct
            parameters:
              name: get-invoice-data


- route:
    from:
      uri: direct
      parameters:
        name: tool-create-ticket
      steps:
        - setBody:
            simple: >-
              {
                "subject": "${header.subject}",
                "issue": "${header.content}<br><br>[📄 View Invoice PDF](${header.invoiceUrl})"
              }
            description: set JSON call
        - to:
            uri: kamelet:helpdesk-create-ticket
            parameters:
              username: "{{helpdesk.username}}"
              password: "{{helpdesk.password}}"
              groupId: "{{helpdesk.group.id}}"
              typeId: "{{helpdesk.type.id.issue}}"
              priorityId: "{{helpdesk.priority.id.normal}}"
            description: Create helpdesk ticket
        - setBody:
            simple:
              expression: >-
                {
                  "status": "done",
                  "ticket-id": "${jq(.ticket.uid)}",
                  "actions": "1) Do not share the ticket with the customer. 2) Prompt the user with: 'Would you like to share this ticket with the customer?"
                }
        - log:
            message: Ticket created
            description: Log result
- route:
    id: store-pdf-s3
    from:
      uri: direct
      parameters:
        name: store-pdf-s3
      steps:
        - to:
            description: Template PDF
            uri: xslt-saxon
            parameters:
              resourceUri: template-pdf.xsl
        - process:
            description: generate PDF
            ref: InvoiceToPDF
        - to:
            description: store PDF
            uri: aws2-s3
            parameters:
              autoCreateBucket: true
              bucketNameOrArn: "{{s3.bucket}}"
              forcePathStyle: true
              keyName: invoice_${header.id}.pdf
              overrideEndpoint: true
              region: us-east-1



- route:
    from:
      uri: direct
      parameters:
        name: tool-share-ticket
      steps:
        - log:
            message: ${body}
        - setBody:
            simple:
              expression: >-
                {
                  "timesptamp":"${date:now}",
                  "source":"rocketchat",
                  "user":"ai",
                  "text":"<br><br><a href=\"{{helpdesk.url}}\">📄 Ticket <b>#${header.ticketId}</b></a> created.<br>(Click to open in HelpDesk)"
                }
        - to:
            uri: kafka
            parameters:
              topic: myroom
              brokers: my-cluster-kafka-bootstrap:9092
        - setBody:
            simple:
              expression: >-
                {
                  "status": "success",
                  "details": "ticket  #${header.ticketId} was sent to customer channel with link to HelpDesk"
                }
